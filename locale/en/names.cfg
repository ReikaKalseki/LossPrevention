[mod-setting-name]
threshold-combination-rule=Evolution condition processing rule

[mod-setting-description]
threshold-combination-rule=How to process evolution capping conditions.\nAll: All conditions clamp evolution to their ceiling if failed, even if other conditions with higher evo thresholds pass, ie the evolution ceiling is that of the lowest failing condition.\nAverage: The evolution ceiling is the average of all passing conditions' caps.\nAny: Evolution can rise to a level permitted by any condition, ie the evolution ceiling is that of the highest failing condition.

[string-mod-setting]
threshold-combination-rule-all=All Conditions
threshold-combination-rule-average=Averaged
threshold-combination-rule-any=Any Condition